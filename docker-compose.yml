services:
  cabinet:
    build: ./backend
    ports:
      - "${CABINET_PORT}:8765"
    environment:
      - CABINET_STORAGE_DIR=${CABINET_STORAGE_DIR}
      - CABINET_MAX_SIZE_MB=${CABINET_MAX_SIZE_MB}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cabinet
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
    depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
    volumes:
      - cabinet-storage:${CABINET_STORAGE_DIR}
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_DB=cabinet
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:  
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d cabinet" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  redis:
    image: redis:7-alpine
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend/cabinet-web
    ports:
      - "5173:80"
    depends_on:
      - cabinet

volumes:
  cabinet-storage:
  postgres_data:
  redis_data: