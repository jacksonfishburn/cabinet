spring.application.name=cabinet

server.port=8765

cabinet.storage-dir=${CABINET_STORAGE_DIR}
cabinet.max-size-mb=${CABINET_MAX_SIZE_MB}
cabinet.code-expiration-ms=${CABINET_CODE_EXPIRATION_MS}

# Datasource (values come from env vars set in docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
